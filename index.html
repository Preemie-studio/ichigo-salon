<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いちご美容室 | あなたらしい美しさを</title>
    <style>
    body {
        background: linear-gradient(to bottom, #ffe4ec, #ffffff);
        text-align: center;
        color: darkblue;
    }
        h1 {
  font-size: 40px;
  color: deeppink;
  border-bottom: 2px dotted pink;
  width: 300px;
  margin: 0 auto;
  padding-bottom: 15px;
  font-family: Georgia,serif;
  letter-spacing: 3px;
}
p {
  color: green;
  font-size: 20px;
    }
    button{
        background-color: pink;
        padding: 15px 30px;
        border-radius: 10px;
        color: white;
        font-size: 18px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    button:hover{
        background-color: deeppink;
    }
    .menu,.info {
        background-color: white;
        width: 300px;
        max-width: 90%;
        margin: 0 auto;
        padding: 20px;
        border-radius: 15px;
        margin-top: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    img{
        width: 400px;
        max-widht: 90%;
        border-radius: 15px;
        height: 250px;
        object-fit: cover;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    .catch{
        font-size: 24px;
        color: deeppink;
        font-weight: bold;
    }
    @media(max-width: 600px){
        h1{
            font-size: 28px;
        }
        .catch{
            font-size: 18px;
        }
        button {
            width: 90%;
            max-width: 300px;
        }
    }
    * {
  box-sizing: border-box;
}
.price{
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid lightgray;
    padding: 12px 5px;
    color: #555555;
}
#message{
    color: deeppink;
    font-weight: bold;
    background-color: #fff0f5;
    padding: 15px;
    border-radius: 10px;
    white-space: pre-line;

}
#message:empty {
    display: none;
}
#message.error {
    color: red;
    background-color: #ffe5e5;
}
#reserveDate {
  padding: 6px;
  border: 2px solid pink;
  border-radius: 10px;
  background-color: #fff5f8;
  font-size: 14px;
}
.price span{
    color: #6b4f4f;
    font-weight: bold;
}
.menu h2, .info h2 {
    color: #c94f70;
    border-bottom: 2px solid #f5b6c8;
    padding-bottom: 10px;
}
.menu, .info {
  transition: transform 0.3s;
}

.menu:hover, .info:hover {
  transform: translateY(-5px);
}
#customerName, #menuSelect, #reserveDate {
  max-width: 90%;
}
.demo-notice {
  background-color: #fff0f5;
  color: #b03060;
  border: 2px solid #f5b6c8;
  border-radius: 10px;
  padding: 12px;
  margin: 15px auto;
  max-width: 90%;
  font-size: 14px;
  font-weight: bold;
}
</style>
</head>
<body>
    <p class="demo-notice">※このサイトはWeb制作学習用の架空の美容室です。実在する店舗ではなく、予約もできません。</p>
    <h1>いちご美容室</h1>
    <img src="salon.png" alt="美容室の写真">
    <p class="catch">あなたの毎日に、ちょっとした特別を。</p>
    <p>あなたらしい美しさを、一緒に。</p>
    <input type="text" id="customerName"placeholder="お名前を入力">
    <select id="menuSelect">
  <option value="">メニューを選んでください</option>
  <option value="カット">カット</option>
  <option value="カラー">カラー</option>
  <option value="縮毛矯正">縮毛矯正</option>
</select>
<input type="date" id="reserveDate"onchange="checkHoliday()">
    <button onclick="reserve()">ご予約はこちら</button>
    <p id="message"></p>
    <div class="menu">
    <h2>メニュー・料金</h2>

    <p class="price">カット <span>3,500円</span></p>
<p class="price">カラー <span>6,000円</span></p>
<p class="price">縮毛矯正 <span>12,000円</span></p>
    </div>
    <div class="info">
  <h2>営業時間・アクセス</h2>
  <p>営業時間：9:00〜18:00</p>
  <p>定休日：毎週月曜日</p>
  <p>住所：〇〇県〇〇市</p>
</div>
<script>
    function checkHoliday() {
  let date = document.getElementById("reserveDate").value;

  if (date === "") return;

  let day = new Date(date + "T00:00:00").getDay();

  if (day === 1) {
    document.getElementById("message").textContent =
      "月曜日は定休日です！別の日を選んでください。";
    document.getElementById("message").classList.add("error");
  } else {
    document.getElementById("message").textContent = "";
    document.getElementById("message").classList.remove("error");
  }
}
    let todayDate = new Date();
let yearToday = todayDate.getFullYear();
let monthToday = String(todayDate.getMonth() + 1).padStart(2, "0");
let dayToday = String(todayDate.getDate()).padStart(2, "0");

document.getElementById("reserveDate").min =
  yearToday + "-" + monthToday + "-" + dayToday;
  function reserve() {
  let name = document.getElementById("customerName").value;
  let menu = document.getElementById("menuSelect").value;
  let date = document.getElementById("reserveDate").value;

  if (name.trim() === "") {
    document.getElementById("message").textContent =
      "お名前を入力してください！";

    document.getElementById("message").classList.add("error");
    return;
  }

  if (menu === "") {
    document.getElementById("message").textContent =
      "メニューを選んでください！";

      document.getElementById("message").classList.add("error");
    return;
  }
  if (date ===""){
    document.getElementById("message").textContent =
    "予約日を選んでください。";

    document.getElementById("message").classList.add("error");
    return;
  }
  let today = new Date();
today.setHours(0, 0, 0, 0);

if (new Date(date + "T00:00:00") < today) {
  document.getElementById("message").textContent =
    "過去の日付は予約できません！";
  return;

}
let reserveDay = new Date(date + "T00:00:00").getDay();

if (reserveDay === 1) {
  document.getElementById("message").textContent =
    "月曜日は定休日です！別の日を選んでください。";
  document.getElementById("message").classList.add("error");
  return;
}
  let [year, month, day] = date.split("-");
let japaneseDate = year + "年" + Number(month) + "月" + Number(day) + "日";

document.getElementById("message").classList.remove("error");

 document.getElementById("message").textContent =
  name + "様\n" + japaneseDate + "に" + menu + "のご予約ありがとうございます！";

  document.getElementById("customerName").value = "";
  document.getElementById("menuSelect").value = "";
  document.getElementById("reserveDate").value = "";
}


</script>
</body>
</html>
